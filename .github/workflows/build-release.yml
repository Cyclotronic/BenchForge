name: Build Release Binary

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Build Executable with PyInstaller
        run: python build_exe.py

      - name: Verify Frozen Application
        env:
          QT_QPA_PLATFORM: offscreen
          BENCHFORGE_IGNORE_SETTINGS: "1"
        run: python tools/verify_frozen_build.py

      - name: Compress Release Folder
        shell: pwsh
        run: Compress-Archive -Path dist/BenchForge/* -DestinationPath dist/BenchForge-Windows.zip

      - name: Create SHA-256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/BenchForge-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BenchForge-Windows.zip" | Set-Content -Encoding ascii dist/BenchForge-Windows.zip.sha256

      - name: Preserve Verified Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BenchForge-Windows-${{ github.event.release.tag_name }}
          path: |
            dist/BenchForge-Windows.zip
            dist/BenchForge-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BenchForge-Windows.zip
            dist/BenchForge-Windows.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
