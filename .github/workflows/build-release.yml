name: Build Release Candidate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_PYTHON: '3.14.6'

jobs:
  build:
    name: Build Verified Windows Candidate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Tagged Source
        uses: actions/checkout@v7

      - name: Confirm Tag Matches Application Version
        shell: pwsh
        run: |
          $value = python -c 'from core.version import __version__; print(__version__)'
          if (-not $value -or 'v' + $value -ne '${{ github.ref_name }}') {
            throw 'Tag ${{ github.ref_name }} does not match core/version.py (' + $value + ')'
          }

      - name: Set up Locked Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.RELEASE_PYTHON }}
          cache: pip
          cache-dependency-path: requirements-release.txt

      - name: Install Locked Release Environment
        run: python -m pip install --requirement requirements-release.txt

      - name: Build Executable with PyInstaller
        run: python build_exe.py

      - name: Verify Frozen Application
        env:
          QT_QPA_PLATFORM: offscreen
          BENCHFORGE_IGNORE_SETTINGS: '1'
        run: python tools/verify_frozen_build.py

      - name: Compress Verified Candidate
        shell: pwsh
        run: |
          Compress-Archive -Path dist/BenchForge/* -DestinationPath dist/BenchForge-Windows.zip
          Copy-Item dist/BenchForge/BUILDINFO.txt dist/BenchForge-Windows.BUILDINFO.txt

      - name: Create SHA-256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/BenchForge-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $hash + '  BenchForge-Windows.zip' | Set-Content -Encoding ascii dist/BenchForge-Windows.zip.sha256

      - name: Preserve Candidate for UAT
        uses: actions/upload-artifact@v7
        with:
          name: BenchForge-Windows-${{ github.ref_name }}
          path: |
            dist/BenchForge-Windows.zip
            dist/BenchForge-Windows.zip.sha256
            dist/BenchForge-Windows.BUILDINFO.txt
          if-no-files-found: error
          retention-days: 90

      - name: Candidate Handoff
        shell: pwsh
        run: |
          'Candidate run: ${{ github.run_id }}' | Add-Content $env:GITHUB_STEP_SUMMARY
          'Download artifact BenchForge-Windows-${{ github.ref_name }} and complete UAT.' | Add-Content $env:GITHUB_STEP_SUMMARY
          'After approval, run the Publish Verified Release workflow with this run ID and tag.' | Add-Content $env:GITHUB_STEP_SUMMARY
